name: Extract PDF text

on:
  workflow_dispatch:
  push:
    paths:
      - "source_pdfs/**"
      - "scripts/extract_pdfs.py"
      - ".github/workflows/extract-pdfs.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF extraction dependency
        run: python -m pip install --upgrade pip pymupdf

      - name: Extract text page by page
        run: python scripts/extract_pdfs.py

      - name: Commit extracted text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted_text/
          if git diff --cached --quiet; then
            echo "No extracted text changes to commit."
          else
            git commit -m "Add extracted text from source PDFs"
            git push
          fi
